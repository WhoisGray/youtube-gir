<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>youtube-gir</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <main class="page">
    <div class="sheet card">
      <header class="brand" style="margin-bottom: 16px">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M11 3a1 1 0 0 1 2 0v9.17l2.3-2.3a1 1 0 0 1 1.4 1.42l-4 4a1 1 0 0 1-1.4 0l-4-4a1 1 0 1 1 1.4-1.42L11 12.17V3zM5 18a1 1 0 0 1 1 1v1h12v-1a1 1 0 1 1 2 0v2a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1z"/></svg>
        </span>
        <div>
          <h1 id="title">youtube-gir</h1>
          <p id="note" class="muted"></p>
        </div>
      </header>
      <div class="seg" id="tabs" role="tablist" hidden>
        <button type="button" id="tab-connection" class="on" role="tab" aria-selected="true"></button>
        <button type="button" id="tab-admin" role="tab" aria-selected="false"></button>
      </div>
      <form id="form">
        <label class="field">
          <span id="label-server"></span>
          <input id="server" name="server" type="url" inputmode="url" autocomplete="off" spellcheck="false" required>
        </label>
        <label class="field">
          <span id="label-key"></span>
          <input id="key" name="key" type="password" autocomplete="off" spellcheck="false">
        </label>
        <div class="actions-end">
          <button id="test" class="ghost" type="button"></button>
          <button id="save" class="primary" type="submit"></button>
        </div>
        <p id="status" class="status-line" role="status"></p>
        <p id="help" class="help muted"></p>
      </form>
      <section id="admin-panel" hidden>
        <form id="key-form" class="row">
          <input id="username" name="username" autocomplete="off" maxlength="32">
          <button id="generate" class="primary" type="submit"></button>
        </form>
        <p id="new-key" class="keybox" hidden></p>
        <p id="users-title" class="muted"></p>
        <ul id="users" class="users"></ul>
        <form id="proxy-form" class="proxy-form">
          <label class="field">
            <span id="label-proxy"></span>
            <input id="proxy" name="proxy" type="text" autocomplete="off" spellcheck="false" placeholder="socks5://127.0.0.1:1080">
          </label>
          <p id="proxy-hint" class="help muted"></p>
          <div class="actions-end">
            <button id="proxy-save" class="primary" type="submit"></button>
          </div>
          <p id="proxy-status" class="status-line" role="status"></p>
        </form>
      </section>
    </div>
  </main>
  <script src="i18n.js"></script>
  <script src="api.js"></script>
  <script src="options.js"></script>
</body>
</html>
