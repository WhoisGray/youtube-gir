<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>youtube-gir</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M11 3a1 1 0 0 1 2 0v9.17l2.3-2.3a1 1 0 0 1 1.4 1.42l-4 4a1 1 0 0 1-1.4 0l-4-4a1 1 0 1 1 1.4-1.42L11 12.17V3zM5 18a1 1 0 0 1 1 1v1h12v-1a1 1 0 1 1 2 0v2a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1z"/></svg>
      </span>
      <div>
        <h1 id="title">youtube-gir</h1>
        <p id="who" class="muted"></p>
      </div>
    </div>
    <button id="settings" class="icon-btn" type="button" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 8.5A3.5 3.5 0 1 0 12 15.5 3.5 3.5 0 0 0 12 8.5zm8.4 2.6-1.5-.3a6.7 6.7 0 0 0-.7-1.6l.9-1.2a1 1 0 0 0-.1-1.3l-1.2-1.2a1 1 0 0 0-1.3-.1l-1.2.9a6.7 6.7 0 0 0-1.6-.7L13 4.1a1 1 0 0 0-1-.9h-1.6a1 1 0 0 0-1 .9l-.3 1.5a6.7 6.7 0 0 0-1.6.7l-1.2-.9a1 1 0 0 0-1.3.1L3.8 6.7a1 1 0 0 0-.1 1.3l.9 1.2a6.7 6.7 0 0 0-.7 1.6l-1.5.3a1 1 0 0 0-.9 1v1.6a1 1 0 0 0 .9 1l1.5.3c.1.6.4 1.1.7 1.6l-.9 1.2a1 1 0 0 0 .1 1.3l1.2 1.2a1 1 0 0 0 1.3.1l1.2-.9c.5.3 1 .6 1.6.7l.3 1.5a1 1 0 0 0 1 .9H12a1 1 0 0 0 1-.9l.3-1.5c.6-.1 1.1-.4 1.6-.7l1.2.9a1 1 0 0 0 1.3-.1l1.2-1.2a1 1 0 0 0 .1-1.3l-.9-1.2c.3-.5.6-1 .7-1.6l1.5-.3a1 1 0 0 0 .9-1V12a1 1 0 0 0-.9-1z"/></svg>
    </button>
  </header>
  <p id="banner" class="banner" hidden></p>
  <section class="stats" aria-label="Stats">
    <article><strong id="stat-count">—</strong><span id="label-count"></span></article>
    <article><strong id="stat-size">—</strong><span id="label-size"></span></article>
    <article><strong id="stat-active">—</strong><span id="label-active"></span></article>
  </section>
  <section id="admin" class="card" hidden>
    <div class="seg" role="tablist">
      <button type="button" id="scope-mine" class="on"></button>
      <button type="button" id="scope-all"></button>
    </div>
  </section>
  <ul id="list" class="list"></ul>
  <section id="empty" class="empty" hidden>
    <strong id="empty-title"></strong>
    <p id="empty-hint" class="muted"></p>
  </section>
  <script src="i18n.js"></script>
  <script src="api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
