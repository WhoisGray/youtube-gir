name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: bash -n bin/youtube-gir install.sh tests/cli_test.sh tests/installer_test.sh
      - name: CLI tests
        run: bash tests/cli_test.sh
      - name: Installer tests
        run: bash tests/installer_test.sh
      - name: ShellCheck
        run: shellcheck bin/youtube-gir install.sh tests/cli_test.sh tests/installer_test.sh
